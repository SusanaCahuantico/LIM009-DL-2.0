<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Lover 2.0 Harry Potter</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
  <main class="container mx-auto p-4">
    <div class="flex flex-col lg:flex-row bg-gray-900 text-white rounded-lg shadow-lg">
      <!-- Sidebar -->
      <div class="w-full lg:w-1/4 p-6">
        <img id="logo" src="imagen/logo.png" alt="logo Harry Potter" class="mb-6">
        <div class="space-y-4">
          <div class="text-lg font-semibold">Ordenar por edad</div>
          <div class="space-y-2">
            <button id="ordenasc" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
              Ascendente
            </button>
            <button id="ordendesc" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
              Descendente
            </button>
          </div>
          <div class="text-lg font-semibold">Filtrar por:</div>
          <div class="space-y-2">
            <select id="genero" class="w-full bg-gray-800 text-white p-2 rounded">
              <option>Género</option>
              <option value="female">Femenino</option>
              <option value="male">Masculino</option>
            </select>
            <select id="rol" class="w-full bg-gray-800 text-white p-2 rounded">
              <option>Rol</option>
              <option value="hogwartsStudent">Estudiante</option>
              <option value="hogwartsStaff">Personal</option>
            </select>
            <select id="casa" class="w-full bg-gray-800 text-white p-2 rounded">
              <option>Casas</option>
              <option value="Gryffindor">Gryffindor</option>
              <option value="Slytherin">Slytherin</option>
              <option value="Hufflepuff">Hufflepuff</option>
              <option value="Ravenclaw">Ravenclaw</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Contenido Principal -->
      <div class="w-full lg:w-3/4 p-6">
        <p class="text-2xl font-bold mb-6">Personajes de la Saga de Harry Potter:</p>
        <div id="personajes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Aquí se cargarán los personajes dinámicamente -->
        </div>
      </div>
    </div>
  </main>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>

</html>
